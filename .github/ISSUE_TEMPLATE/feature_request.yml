name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open ideas can also start in Discussions. StatusConnect must keep running on shared
        hosting (PHP, MySQL and a minute cron, no daemons or brokers): keep that in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
