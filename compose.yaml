name: statusconnect

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8070}:80"
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8070}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-statusconnect}
      DB_USERNAME: ${DB_USERNAME:-statusconnect}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@statusconnect.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-StatusConnect}
      TARGET_URL: ${TARGET_URL:-http://target:8080}
      AGENT_INGEST_ENABLED: ${AGENT_INGEST_ENABLED:-false}
    env_file:
      - path: .env
        required: false

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-statusconnect}
      MYSQL_USER: ${DB_USERNAME:-statusconnect}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8035}:8025"
      - "${MAILPIT_SMTP_PORT:-1035}:1025"

  target:
    build:
      context: .
      dockerfile: docker/target/Dockerfile
    ports:
      - "${TARGET_PORT:-8095}:8080"

  # Optional agents for validating docs/integrations/agents-pull.md:
  #   docker compose --profile agents up -d glances node-exporter netdata
  glances:
    profiles:
      - agents
    image: nicolargo/glances:4.3.1
    pid: host
    environment:
      GLANCES_OPT: "-w --disable-webui"

  node-exporter:
    profiles:
      - agents
    image: prom/node-exporter:v1.8.2

  netdata:
    profiles:
      - agents
    image: netdata/netdata:v2.2.6
    environment:
      DO_NOT_TRACK: "1"

  # Optional Telegraf pushing to POST /ingest/{token} (docs/integrations/telegraf.md).
  # Dev/test only. Needs AGENT_INGEST_ENABLED=true and the agent monitor's token:
  #   STATUSCONNECT_AGENT_TOKEN=sca_... docker compose --profile telegraf up -d telegraf
  telegraf:
    profiles:
      - telegraf
    image: telegraf:1.32.3
    depends_on:
      - app
    environment:
      STATUSCONNECT_AGENT_TOKEN: ${STATUSCONNECT_AGENT_TOKEN:-}
    volumes:
      - ./docker/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # Optional OpenTelemetry Collector pushing OTLP/HTTP JSON to /ingest/{token}/v1/metrics
  # (docs/integrations/opentelemetry.md). Dev/test only, same token variable as telegraf:
  #   STATUSCONNECT_AGENT_TOKEN=sca_... docker compose --profile otelcol up -d otelcol
  otelcol:
    profiles:
      - otelcol
    image: otel/opentelemetry-collector-contrib:0.115.1
    depends_on:
      - app
    environment:
      STATUSCONNECT_AGENT_TOKEN: ${STATUSCONNECT_AGENT_TOKEN:-}
    volumes:
      - ./docker/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro

  node:
    profiles:
      - dev
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - npm_cache:/root/.npm
    environment:
      VITE_DEV_SERVER_HOST: 0.0.0.0
    command: ["npm", "--prefix", "frontend", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  mysql_data:
  composer_cache:
  npm_cache:
