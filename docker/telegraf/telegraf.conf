# Dev/test only: pushes this container's view of the host to the local app.
# Usage: see docs/integrations/telegraf.md ("Try it in the dev environment").
[agent]
  interval = "60s"
  flush_interval = "60s"
  hostname = "dev-host"
  omit_hostname = false

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  fieldinclude = ["usage_user", "usage_system", "usage_idle", "usage_iowait"]

[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent"]

[[inputs.disk]]
  mount_points = ["/"]
  fieldinclude = ["used_percent", "inodes_used_percent"]

[[inputs.system]]
  fieldinclude = ["load1", "load5", "load15", "uptime"]

[[outputs.http]]
  url = "http://app/ingest/${STATUSCONNECT_AGENT_TOKEN}"
  method = "POST"
  data_format = "influx"
  content_encoding = "gzip"
  timeout = "10s"
  [outputs.http.headers]
    Content-Type = "text/plain; charset=utf-8"
